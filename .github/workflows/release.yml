name: Release
on:
  push:
    tags: ['v*']
  # Dry-run: builds every platform WITHOUT publishing — tauri-action only
  # creates a release when tagName is set (empty on dispatch). Use this to
  # validate the build matrix safely:  gh workflow run release.yml
  workflow_dispatch:

jobs:
  release:
    strategy:
      # A macOS failure must never block the Windows release (and vice versa).
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            rust_targets: ''
          - platform: macos-latest
            # One universal binary serving both Intel and Apple Silicon.
            args: '--target universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Verify version consistency
        shell: bash
        run: |
          PKG=$(jq -r .version package.json)
          CARGO=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          TAURI=$(jq -r .version src-tauri/tauri.conf.json)
          echo "package.json=$PKG Cargo.toml=$CARGO tauri.conf.json=$TAURI"
          if [ "$PKG" != "$CARGO" ] || [ "$PKG" != "$TAURI" ]; then
            echo "::error::Version mismatch! All three files must match."
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - run: pnpm install

      # macOS artifacts are NOT Apple-signed/notarized (no Apple Developer ID
      # cert on file) — Gatekeeper requires right-click → Open on first launch.
      # To enable signing later: add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
      # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID as repo
      # secrets and wire them into the env block below. The Tauri UPDATER
      # signature (Ed25519, TAURI_SIGNING_PRIVATE_KEY) is platform-independent
      # and already applied to every platform's updater artifact.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Markd {0}', github.ref_name) || '' }}
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
