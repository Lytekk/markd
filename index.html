<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markd</title>
    <script>
      // Apply the saved theme before the first paint.
      //
      // --bg-color is declared only under [data-theme], which React does not set
      // until useTheme's mount effect runs. Until then var(--bg-color) is
      // unresolved and the page paints WHITE — so a night-theme user watched a
      // white rectangle for the whole boot and then a flash to dark. Same key and
      // same "markd" -> "day" migration useTheme applies; this only pre-applies
      // the answer, it does not own it.
      (function () {
        try {
          var stored = localStorage.getItem("markd-theme");
          if (stored === "markd") stored = "day";
          var theme = stored === "day" || stored === "night" ? stored : "day";
          var root = document.documentElement;
          // Setting data-theme is the whole job: base.css gives <html> a
          // background of var(--bg-color), and the theme files define that under
          // this attribute. Do NOT also write an inline style here — an inline
          // style attribute outranks every author rule, so it would pin the
          // boot-time colour forever and a later theme switch would leave the
          // page background on the old theme.
          root.dataset.theme = theme;
        } catch (e) {
          // Storage disabled — fall through to the default theme.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
