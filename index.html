<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markd</title>
    <script>
      // Boot dark, always — then hand off to the user's real theme.
      //
      // The window is created with a dark backgroundColor (tauri.conf.json) and
      // is revealed before WebView2 has painted anything, so the first frames
      // come from the native layer. Painting this document dark as well makes
      // the whole startup one continuous dark surface instead of a white flash.
      // A blinding white rectangle is the thing being fixed, and it is worth a
      // brief dark moment for a day-theme user to avoid it.
      //
      // useTheme reads the SAME key and applies the real theme on mount; when it
      // differs from this boot theme it cross-fades rather than snapping, via
      // the data-boot-theme handshake below. Do NOT write an inline background
      // here — an inline style outranks every author rule and would pin the boot
      // colour past every later theme change.
      (function () {
        var root = document.documentElement;
        var theme = "day";
        try {
          var stored = localStorage.getItem("markd-theme");
          if (stored === "markd") stored = "day";
          if (stored === "day" || stored === "night") theme = stored;
        } catch (e) {
          // Storage disabled — fall through to the default theme.
        }
        root.dataset.theme = "night";
        // Where useTheme should end up, so it knows whether it has to travel to
        // get there. useTheme clears this once it has applied the real theme.
        root.dataset.bootTheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
